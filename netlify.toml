# Configuration Netlify pour le déploiement d'Iron Track

[build]
  command = "npm run build"
  publish = "dist"

# Redirection pour Single Page Applications (SPA) React
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# En-têtes de Sécurité HTTP
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    Cache-Control = "public, max-age=0, must-revalidate"
    
    # Content Security Policy (CSP) très stricte
    # Autorise uniquement le domaine actuel, et les API Supabase
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self' https://*.supabase.co wss://*.supabase.co;"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
